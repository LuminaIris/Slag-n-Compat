
modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

authors="Lumina Iris"

description='''
Adding more mod compatibility to Slag n' Embers!
'''

#[[mixins]]
#config="${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="slag"
    type="required"
    versionRange="[1.2a,)"
    ordering="NONE"
    side="BOTH"

# optional mod compat
[[dependencies.${mod_id}]]
    modId="mekanism"
    type="optional"
    versionRange="[10.7.15.81,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="allthemodium"
    type="optional"
    versionRange="[2.6.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="iceandfire"
    type="optional"
    versionRange="[1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="twilightforest"
    type="optional"
    versionRange="[4.6.2856,)"
    ordering="NONE"
    side="BOTH"